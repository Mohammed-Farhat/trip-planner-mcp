[project]
name = "trip-planner-mcp"
version = "0.1.0"
description = "Weather & Trip Planner: a three-tool MCP toolkit (FastMCP) driven by an OpenAI Agents SDK agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.1.3",
    "openai-agents==0.24.0",
    "httpx2>=2.12",
    "python-dotenv>=1.1",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trip_mcp", "host"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Open-Meteo API (run with: uv run pytest -m live)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]
